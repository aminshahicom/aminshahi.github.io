name: Update gallery
on:
  push:
    paths: ['images/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gallery.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/gallery.json
          git diff --cached --quiet || (git commit -m "Update gallery" && git push)

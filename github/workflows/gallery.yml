name: Organize images
on:
  push:
    paths: ['images/**', 'data/projects.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gallery.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A images data
          git diff --cached --quiet || (git commit -m "Organize project images" && git pull --rebase && git push)
